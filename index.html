<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log & Lift Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp }                          from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
                                                  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, getDocs, addDoc, setDoc, deleteDoc, query, orderBy }
                                                  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ─── INIT ────────────────────────────────────────────────────────────────────
const app  = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getFirestore(app);

let currentUser = null;
let appData     = null;
let chartInstances = {};
let currentTab  = 'cardio';

// ─── AUTH ─────────────────────────────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  currentUser = user;
  if (user) {
    showApp();
    loadData();
  } else {
    showLogin();
  }
});

window.loginWithGoogle = async () => {
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    showToast('Error al iniciar sesión: ' + e.message, true);
  }
};

window.logout = async () => {
  await signOut(auth);
};

// ─── FIRESTORE HELPERS ────────────────────────────────────────────────────────
function userCol(colName) {
  return collection(db, 'users', currentUser.uid, colName);
}
function userDoc(colName, id) {
  return doc(db, 'users', currentUser.uid, colName, id);
}

async function loadData() {
  document.getElementById('app').innerHTML = '<div class="loading">Cargando datos...</div>';

  const [sessSnap, weightSnap, strengthSnap, profileSnap] = await Promise.all([
    getDocs(query(userCol('sessions'),   orderBy('date'))),
    getDocs(query(userCol('weight_log'), orderBy('date'))),
    getDocs(query(userCol('strength_log'), orderBy('date'))),
    getDocs(userCol('profile'))
  ]);

  const profile = profileSnap.docs[0]?.data() || null;

  appData = {
    profile:      profile,
    sessions:     sessSnap.docs.map(d => ({ _id: d.id, ...d.data() })),
    weight_log:   weightSnap.docs.map(d => ({ _id: d.id, ...d.data() })),
    strength_log: strengthSnap.docs.map(d => ({ _id: d.id, ...d.data() }))
  };

  // Usuario nuevo: sin perfil → mostrar onboarding
  if (!profile) {
    renderOnboarding();
    return;
  }

  renderApp();
}

// ─── ONBOARDING ───────────────────────────────────────────────────────────────
function renderOnboarding() {
  document.getElementById('app').innerHTML = `
    <div class="onboarding-card">
      <p style="font-size:22px;margin-bottom:6px;">👋 Bienvenido a Log & Lift</p>
      <p style="color:#888;font-size:13px;margin-bottom:28px;">Cuéntanos un poco sobre ti para empezar.</p>

      <div class="form-row">
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" id="ob-name" placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label>Edad</label>
          <input type="number" id="ob-edad" placeholder="33" min="10" max="100">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Altura (m)</label>
          <input type="number" id="ob-altura" placeholder="1.70" step="0.01">
        </div>
        <div class="form-group">
          <label>Peso inicial (kg)</label>
          <input type="number" id="ob-peso" placeholder="70.0" step="0.01">
        </div>
      </div>
      <div class="form-group">
        <label>Objetivo de peso (kg)</label>
        <input type="number" id="ob-objetivo" placeholder="65.0" step="0.01">
      </div>

      <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="saveOnboarding()">
        Comenzar →
      </button>

      <div style="margin-top:20px;padding-top:20px;border-top:0.5px solid #2A2A2A;">
        <p style="font-size:11px;color:#666;margin-bottom:10px;">¿Tienes datos históricos en JSON?</p>
        <button class="btn btn-secondary" style="width:100%;font-size:12px;" onclick="document.getElementById('import-file').click()">
          📂 Importar backup JSON
        </button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importFromFile(event)">
        <p style="font-size:10px;color:#555;margin-top:6px;text-align:center;">Acepta el archivo <code>data/sessions.json</code></p>
      </div>
    </div>
  `;
}

window.saveOnboarding = async () => {
  const name    = document.getElementById('ob-name').value.trim();
  const edad    = parseInt(document.getElementById('ob-edad').value);
  const altura  = parseFloat(document.getElementById('ob-altura').value);
  const peso    = parseFloat(document.getElementById('ob-peso').value);
  const objetivo= parseFloat(document.getElementById('ob-objetivo').value);

  if (!altura || !edad) { showToast('Altura y edad son obligatorias', true); return; }

  const profile = { name, edad, altura, objetivo: objetivo || null };
  await setDoc(doc(userCol('profile'), 'main'), profile);

  if (peso) {
    await addDoc(userCol('weight_log'), { date: new Date().toISOString().slice(0,10), weight: peso });
  }

  await loadData();
};

window.importFromFile = async (event) => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const text = await file.text();
    const json = JSON.parse(text);
    await importData(json);
  } catch (e) {
    showToast('Error al leer el archivo: ' + e.message, true);
  }
};

async function importData(json) {
  showToast('Importando datos...');

  // Guardar perfil si no existe
  if (json.profile) {
    await setDoc(doc(userCol('profile'), 'main'), json.profile);
  }

  // Importar colecciones en paralelo
  const writes = [
    ...(json.sessions     || []).map(s  => addDoc(userCol('sessions'),     s)),
    ...(json.weight_log   || []).map(w  => addDoc(userCol('weight_log'),   w)),
    ...(json.strength_log || []).map(sl => addDoc(userCol('strength_log'), sl)),
  ];
  await Promise.all(writes);

  showToast(`✓ ${json.sessions?.length || 0} sesiones importadas`);
  await loadData();
}

window.importHistorical = async () => {
  try {
    const json = await fetch('data/sessions.json').then(r => r.json());
    await importData(json);
  } catch (e) {
    showToast('No se encontró data/sessions.json', true);
  }
};

// ─── SAVE HELPERS ─────────────────────────────────────────────────────────────
window.saveEntry = async () => {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    if (currentTab === 'cardio') {
      const date     = document.getElementById('c-date').value;
      const type     = document.getElementById('c-type').value;
      const duration = parseFloat(document.getElementById('c-duration').value) || null;
      const distance = parseFloat(document.getElementById('c-distance').value) || null;
      const calories = parseInt(document.getElementById('c-calories').value)   || null;
      const hr_avg   = parseInt(document.getElementById('c-hr').value)          || null;
      const notes    = document.getElementById('c-notes').value.trim();
      const pace     = (duration && distance) ? parseFloat((duration / distance).toFixed(2)) : null;
      if (!date || !type) { showToast('Fecha y tipo son obligatorios', true); return; }
      await addDoc(userCol('sessions'), { date, type, duration, distance, calories, hr_avg, pace, notes });

    } else if (currentTab === 'pesas') {
      const date     = document.getElementById('p-date').value;
      const group    = document.getElementById('p-group').value.trim() || 'General';
      const duration = parseInt(document.getElementById('p-duration').value)  || null;
      const calories = parseInt(document.getElementById('p-calories').value)  || null;
      const notes    = document.getElementById('p-notes').value.trim();
      if (!date) { showToast('La fecha es obligatoria', true); return; }

      const rows = document.getElementById('exercises-list').querySelectorAll('.exercise-row');
      const exercises = Array.from(rows).map(r => {
        const inputs = r.querySelectorAll('input');
        return { name: inputs[0].value.trim(), sets: parseInt(inputs[1].value)||null, reps: parseInt(inputs[2].value)||null, weight: inputs[3].value.trim() };
      }).filter(e => e.name);

      await Promise.all([
        addDoc(userCol('sessions'),     { date, type: 'pesas', duration, distance: null, calories, hr_avg: null, pace: null, notes }),
        addDoc(userCol('strength_log'), { date, muscle_group: group, exercises })
      ]);

    } else if (currentTab === 'peso') {
      const date   = document.getElementById('w-date').value;
      const weight = parseFloat(document.getElementById('w-weight').value);
      if (!date || isNaN(weight)) { showToast('Fecha y peso son obligatorios', true); return; }

      // Buscar si ya existe registro de ese día
      const existing = appData.weight_log.find(w => w.date === date);
      if (existing) {
        await setDoc(userDoc('weight_log', existing._id), { date, weight });
      } else {
        await addDoc(userCol('weight_log'), { date, weight });
      }
    }

    showToast('Guardado correctamente ✓');
    closeModal();
    await loadData();
  } catch (e) {
    showToast('Error: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Guardar';
  }
};

// ─── RENDER LOGIN ─────────────────────────────────────────────────────────────
function showLogin() {
  document.getElementById('header-bar').style.display = 'none';
  document.getElementById('app').innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <h1 style="font-size:28px;margin-bottom:6px;">Log & Lift</h1>
        <p style="color:#888;font-size:13px;margin-bottom:32px;">Tu dashboard de entrenamiento personal</p>
        <button class="btn-google" onclick="loginWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 18 18" style="margin-right:10px;flex-shrink:0">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
            <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/>
          </svg>
          Continuar con Google
        </button>
      </div>
    </div>
  `;
  document.querySelector('.fab')?.remove();
}

function showApp() {
  document.getElementById('header-bar').style.display = 'flex';
  if (!document.querySelector('.fab')) {
    const fab = document.createElement('button');
    fab.className = 'fab';
    fab.title = 'Registrar sesión';
    fab.textContent = '+';
    fab.onclick = openModal;
    document.body.appendChild(fab);
  }
}

// ─── RENDER APP ───────────────────────────────────────────────────────────────
function renderApp() {
  const d        = appData;
  const sessions = d.sessions.slice().sort((a,b) => a.date.localeCompare(b.date));
  const weights  = d.weight_log.slice().sort((a,b) => a.date.localeCompare(b.date));
  const strength = d.strength_log.slice().sort((a,b) => a.date.localeCompare(b.date));

  const latestWeight = weights.length ? weights[weights.length-1].weight : null;
  const firstWeight  = weights.length ? weights[0].weight : null;
  const weightDiff   = latestWeight && firstWeight ? (latestWeight - firstWeight).toFixed(2) : null;
  const imc          = latestWeight ? (latestWeight / (d.profile.altura ** 2)).toFixed(1) : '—';
  const cardioSess   = sessions.filter(s => s.pace);
  const bestPace     = cardioSess.length ? Math.min(...cardioSess.map(s => s.pace)) : null;
  const totalKcal    = sessions.reduce((sum,s) => sum + (s.calories||0), 0);
  const totalKm      = sessions.reduce((sum,s) => sum + (s.distance||0), 0);
  const activeDays   = new Set(sessions.map(s => s.date)).size;
  const weekNum      = calcWeekNum(sessions);

  function fp(p) {
    if (!p) return '—';
    const m = Math.floor(p), s = Math.round((p-m)*60);
    return `${m}'${String(s).padStart(2,'0')}"`;
  }

  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};

  document.getElementById('app').innerHTML = `
    <h1>Log & Lift <span class="badge">Semana ${weekNum}</span></h1>
    <p class="subtitle">${sessions.length ? fmtDate(sessions[0].date) + ' — ' + fmtDate(sessions[sessions.length-1].date) : 'Sin sesiones aún'} · ${d.profile.edad} años · ${d.profile.altura}m</p>

    <div class="metrics">
      <div class="metric">
        <p class="metric-label">Peso actual</p>
        <p class="metric-value green">${latestWeight ? latestWeight.toFixed(2)+' kg' : '—'}</p>
        <p class="metric-sub">${weightDiff!==null ? (weightDiff>0?'↑':'↓')+' '+Math.abs(weightDiff)+' kg desde inicio' : 'Sin registros'}</p>
      </div>
      <div class="metric">
        <p class="metric-label">IMC</p>
        <p class="metric-value blue">${imc}</p>
        <p class="metric-sub">${imc !== '—' ? 'Rango normal ✓' : ''}</p>
      </div>
      <div class="metric">
        <p class="metric-label">Mejor ritmo</p>
        <p class="metric-value purple">${fp(bestPace)}</p>
        <p class="metric-sub">min/km</p>
      </div>
      <div class="metric">
        <p class="metric-label">Días activos</p>
        <p class="metric-value orange">${activeDays}</p>
        <p class="metric-sub">Sesiones totales</p>
      </div>
      <div class="metric">
        <p class="metric-label">Kcal activas</p>
        <p class="metric-value green">${totalKcal.toLocaleString()}</p>
        <p class="metric-sub">Total quemadas</p>
      </div>
      <div class="metric">
        <p class="metric-label">Distancia</p>
        <p class="metric-value blue">${totalKm.toFixed(1)} km</p>
        <p class="metric-sub">Total recorrida</p>
      </div>
    </div>

    ${weights.length >= 2 ? `
    <div class="section">
      <p class="section-title">📊 Progresión de peso</p>
      <div style="height:180px"><canvas id="pesoChart"></canvas></div>
      <div class="progress-bar-container">
        <div class="progress-label"><span>Inicio: ${firstWeight} kg</span><span>Hoy: ${latestWeight} kg</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,Math.max(0,((firstWeight-latestWeight)/(firstWeight-65))*100)).toFixed(0)}%"></div></div>
        <div style="font-size:11px;color:#666;margin-top:4px;">Objetivo estimado: 65–67 kg con músculo ganado</div>
      </div>
    </div>` : ''}

    ${cardioSess.length >= 2 ? `
    <div class="section">
      <p class="section-title">🏃 Progresión de ritmo (min/km)</p>
      <div style="height:160px"><canvas id="ritmoChart"></canvas></div>
    </div>` : ''}

    ${sessions.length ? `
    <div class="section">
      <p class="section-title">🔥 Calorías activas por sesión</p>
      <div style="height:180px"><canvas id="kcalChart"></canvas></div>
    </div>
    <div class="section">
      <p class="section-title">❤️ Frecuencia cardíaca promedio</p>
      <div style="height:160px"><canvas id="fcChart"></canvas></div>
    </div>` : ''}

    <div class="section">
      <p class="section-title">📅 Registro de sesiones</p>
      ${sessions.length === 0 ? `
        <div class="empty-state">
          <p>Sin sesiones registradas aún.</p>
          <button class="btn-import" onclick="document.getElementById('import-file-dash').click()">
            📂 Importar desde JSON
          </button>
          <input type="file" id="import-file-dash" accept=".json" style="display:none" onchange="importFromFile(event)">
          <p style="margin-top:12px;font-size:11px;color:#555;">O usa el botón <strong style="color:#888">+</strong> para registrar tu primera sesión.</p>
        </div>` : `
      <div class="gym-log">
        ${sessions.slice().reverse().map(s => `
          <div class="gym-day">
            <div>
              <p class="gym-date">${fmtDateShort(s.date)}</p>
              <span class="tag tag-${s.type}">${typeLabel(s.type)}</span>
            </div>
            <div>
              <p class="gym-activity">${sessionDetail(s)}</p>
              ${s.notes ? `<p style="font-size:11px;color:#666;margin-top:2px;">${s.notes}</p>` : ''}
            </div>
            <p class="gym-kcal" style="color:${typeColor(s.type)}">${s.calories ? s.calories+' kcal' : '—'}</p>
          </div>
        `).join('')}
      </div>`}
    </div>

    ${strength.slice().reverse().map(sl => `
    <div class="section">
      <p class="section-title">💪 Pesas · ${sl.muscle_group} — ${fmtDateShort(sl.date)}</p>
      <table class="pesas-table">
        <tr><th>Ejercicio</th><th>Series</th><th>Peso</th></tr>
        ${sl.exercises.map(e => `<tr><td>${e.name}</td><td>${e.sets}${e.reps?' × '+e.reps:''}</td><td>${e.weight}</td></tr>`).join('')}
      </table>
    </div>`).join('')}

    <footer>Log & Lift · Actualizado ${fmtDateShort(new Date().toISOString().slice(0,10))}</footer>
  `;

  const grid = 'rgba(255,255,255,0.06)', txt = '#666';

  if (weights.length >= 2) {
    chartInstances.peso = new Chart(document.getElementById('pesoChart'), {
      type: 'line',
      data: {
        labels: weights.map(w => fmtDateShort(w.date)),
        datasets: [{ data: weights.map(w => w.weight), borderColor: '#4CD9A0', backgroundColor: 'rgba(76,217,160,0.08)', borderWidth: 2, pointBackgroundColor: weights.map((w,i) => i===weights.length-1?'#4CD9A0':'#5BA3E8'), pointRadius: weights.map((w,i) => i===weights.length-1?7:4), fill: true, tension: 0.3 }]
      },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y.toFixed(2)+' kg'}}}, scales:{y:{ticks:{color:txt,callback:v=>v+' kg'},grid:{color:grid}},x:{ticks:{color:txt,autoSkip:true,maxTicksLimit:8,font:{size:10}},grid:{color:grid}}} }
    });
  }

  if (cardioSess.length >= 2) {
    chartInstances.ritmo = new Chart(document.getElementById('ritmoChart'), {
      type: 'line',
      data: {
        labels: cardioSess.map(s => fmtDateShort(s.date)),
        datasets: [{ data: cardioSess.map(s => s.pace), borderColor: '#A78BFA', backgroundColor: 'rgba(167,139,250,0.08)', borderWidth: 2, pointBackgroundColor: cardioSess.map((s,i)=>i===cardioSess.length-1?'#4CD9A0':'#A78BFA'), pointRadius: cardioSess.map((s,i)=>i===cardioSess.length-1?7:4), fill: true, tension: 0.3 }]
      },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fp(c.parsed.y)+' min/km'}}}, scales:{y:{reverse:true,ticks:{color:txt,callback:v=>Math.floor(v)+"'"},grid:{color:grid}},x:{ticks:{color:txt,autoSkip:true,maxTicksLimit:8,font:{size:10}},grid:{color:grid}}} }
    });
  }

  if (sessions.length) {
    const kcalColors = {caminadora:'#185FA5',carrera:'#A78BFA',bici:'#4CD9A0',pesas:'#FB923C',caminata:'#4CD9A0',otro:'#888'};
    chartInstances.kcal = new Chart(document.getElementById('kcalChart'), {
      type: 'bar',
      data: { labels: sessions.map(s=>fmtDateShort(s.date)), datasets:[{data:sessions.map(s=>s.calories||0),backgroundColor:sessions.map(s=>kcalColors[s.type]||'#888'),borderRadius:4}] },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y+' kcal'}}}, scales:{y:{beginAtZero:true,ticks:{color:txt},grid:{color:grid}},x:{ticks:{color:txt,autoSkip:true,maxTicksLimit:8,font:{size:10}},grid:{color:grid}}} }
    });

    const fcSess = sessions.filter(s=>s.hr_avg);
    if (fcSess.length) {
      chartInstances.fc = new Chart(document.getElementById('fcChart'), {
        type: 'line',
        data: { labels: fcSess.map(s=>fmtDateShort(s.date)), datasets:[{data:fcSess.map(s=>s.hr_avg),borderColor:'#F87171',backgroundColor:'rgba(248,113,113,0.07)',borderWidth:2,pointBackgroundColor:'#F87171',pointRadius:4,fill:true,tension:0.3}] },
        options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y+' lpm'}}}, scales:{y:{ticks:{color:txt,callback:v=>v+' lpm'},grid:{color:grid}},x:{ticks:{color:txt,autoSkip:true,maxTicksLimit:8,font:{size:10}},grid:{color:grid}}} }
      });
    }
  }
}

// ─── MODAL ────────────────────────────────────────────────────────────────────
window.openModal = function() {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('c-date').value = today;
  document.getElementById('p-date').value = today;
  document.getElementById('w-date').value = today;
  document.getElementById('modal').classList.add('open');
};
window.closeModal = function() {
  document.getElementById('modal').classList.remove('open');
};
window.switchTab = function(tab) {
  currentTab = tab;
  ['cardio','pesas','peso'].forEach((t,i) => {
    document.getElementById('tab-'+t).style.display = t===tab?'':'none';
    document.querySelectorAll('.tab-btn')[i].classList.toggle('active', t===tab);
  });
};
window.addExercise = function() {
  const row = document.createElement('div');
  row.className = 'exercise-row';
  row.innerHTML = `<input type="text" placeholder="Ejercicio"><input type="number" placeholder="Series" min="1"><input type="number" placeholder="Reps" min="1"><input type="text" placeholder="Peso"><button class="remove-ex" onclick="removeExercise(this)">×</button>`;
  document.getElementById('exercises-list').appendChild(row);
};
window.removeExercise = function(btn) {
  if (document.getElementById('exercises-list').children.length > 1) btn.parentElement.remove();
};

// ─── TOAST ────────────────────────────────────────────────────────────────────
function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError?' error':'');
  setTimeout(() => t.classList.remove('show'), 3000);
}
window.showToast = showToast;

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function fmtDate(d) {
  if (!d) return '';
  const [y,m,dd] = d.split('-');
  return `${parseInt(dd)} ${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][m-1]} ${y}`;
}
function fmtDateShort(d) {
  if (!d) return '';
  const [,m,dd] = d.split('-');
  return `${parseInt(dd)} ${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][m-1]}`;
}
function typeLabel(t) { return {caminadora:'Caminadora',carrera:'Carrera',bici:'Bicicleta',pesas:'💪 Pesas',caminata:'Caminata',otro:'Otro'}[t]||t; }
function typeColor(t)  { return {caminadora:'#5BA3E8',carrera:'#A78BFA',bici:'#4CD9A0',pesas:'#FB923C',caminata:'#4CD9A0',otro:'#888'}[t]||'#888'; }
function sessionDetail(s) {
  const p = [];
  if (s.duration) p.push(s.duration+' min');
  if (s.distance) p.push(s.distance.toFixed(2)+' km');
  if (s.hr_avg)   p.push(s.hr_avg+' lpm');
  return p.join(' · ')||'—';
}
function calcWeekNum(sessions) {
  if (!sessions.length) return 1;
  const diff = new Date(sessions[sessions.length-1].date) - new Date(sessions[0].date);
  return Math.max(1, Math.ceil(diff/(7*86400000))+1);
}
</script>

<script>
// Actualizar avatar/nombre cuando cambia el auth state
// (se ejecuta después del módulo ES)
document.addEventListener('userLoaded', e => {
  const u = e.detail;
  if (u) {
    document.getElementById('user-avatar').src  = u.photoURL || '';
    document.getElementById('user-name').textContent = u.displayName || u.email;
  }
});
</script>

<script type="module">
// Emitir evento con el usuario para el script anterior
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
const auth = getAuth(getApp());
onAuthStateChanged(auth, user => {
  document.dispatchEvent(new CustomEvent('userLoaded', { detail: user }));
});
</script>
